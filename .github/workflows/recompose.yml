name: recompose
# Re-run only the compose + store of a production run whose render succeeded but whose compose failed
# (the frames are kept as artifacts for 7 days). Uses the current main, so a compose fix applies without a re-render.
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "produce run id whose chunk-/data- artifacts are used"
        required: true
      short:
        description: "short name, e.g. ladder_volcanoes"
        required: true
concurrency:
  group: recompose
  cancel-in-progress: false
permissions:
  contents: write
  actions: read
jobs:
  recompose:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - run: |
          pip install --quiet pillow
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
      - uses: actions/download-artifact@v4
        with:
          pattern: chunk-${{ inputs.short }}-*
          path: chunks
          merge-multiple: true
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - uses: actions/download-artifact@v4
        with:
          name: data-${{ inputs.short }}
          path: .
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
      - run: |
          python shorts/compose.py ${{ inputs.short }} chunks/${{ inputs.short }} final
          rm -rf final/work/seq final/work/cap
      - uses: actions/upload-artifact@v4
        with:
          name: short-${{ inputs.short }}-full
          path: final/
          retention-days: 14
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 automation/episodes.py store ${{ inputs.short }} final
          python3 -c "from core import ytguard; ytguard.persist(['state/episodes.json'], 'state: ${{ inputs.short }} ready')"
